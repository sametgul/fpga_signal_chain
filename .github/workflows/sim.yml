name: sim

on:
  push:
  pull_request:

jobs:
  ghdl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: ghdl/setup-ghdl@v1
        with:
          version: 6.0.0 # same as the local Homebrew GHDL; bump both together
          backend: llvm

      - run: scripts/run_sims.sh
